<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniztasunarekiko arreta - Orientazio tresna</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Calibri', 'Arial', sans-serif;
        }
        
        body {
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            font-size: 20px;
        }

        h1, h2, h3 { color: #2c3e50; }

        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar h1 {
            margin: 0;
            font-size: 30px;
            color: white;
            flex-grow: 1;
            text-align: center;
        }

        .user-greeting {
            font-size: 20px;
            margin-right: 20px;
            font-weight: bold;
            color: #1abc9c;
        }

        .btn {
            font-size: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; width: 100%; margin-top: 15px; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-warning { background-color: #f1c40f; color: #2c3e50; }
        .btn-warning:hover { background-color: #f39c12; }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
        }

        textarea { resize: vertical; height: 120px; }
        .word-counter { text-align: right; font-size: 16px; color: #7f8c8d; margin-top: 5px; }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }

        .checkbox-item { display: flex; align-items: center; gap: 10px; }
        .checkbox-item input { transform: scale(1.5); }

        .high-support-alert {
            border: 3px solid #e74c3c !important;
            background-color: #fdf2f2;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .filters { display: flex; gap: 15px; margin-bottom: 20px; background: #eee; padding: 15px; border-radius: 5px; }
        .record-card {
            background: #fdfdfd;
            border-left: 5px solid #3498db;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 5px 5px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
            z-index: 2000;
        }

        .report-output {
            background: #f9f9f9;
            border: 2px dashed #7f8c8d;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="btn btn-warning" onclick="goHome()">Hasiera</button>
        <h1>Aniztasunarekiko arreta</h1>
        <div style="display: flex; align-items: center;">
            <span class="user-greeting" id="user-display"></span>
            <button class="btn btn-danger" id="logout-btn" style="display:none;" onclick="logout()">Aldatu erabiltzailea</button>
        </div>
    </div>

    <div class="container">
        <div id="screen-login" class="screen active">
            <h2>Ongi etorri orientazio aplikaziora</h2>
            <p style="font-size: 18px; color: #7f8c8d;">Datu guztiak zure gailuan bakarrik gordetzen dira modu pribatuan (LocalStorage).</p>
            <div class="form-group">
                <label for="login-name">Orientatzailearen izena (Nick bat): *</label>
                <input type="text" id="login-name" placeholder="Adibidez: miren_orientatzaile">
            </div>
            <button class="btn btn-primary" onclick="login()">Sartu</button>
        </div>

        <div id="screen-main" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px;">
                <h2>HPB/HBLP erregistro formularioa</h2>
                <a href="#zerrenda-section" class="btn btn-warning" style="text-decoration: none;">Ikusi erregistroak</a>
            </div>

            <form id="case-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Data (Urtea/Hilea/Eguna):</label>
                        <input type="date" id="form-date" required>
                    </div>
                    <div class="form-group">
                        <label>Profesionala:</label>
                        <input type="text" id="form-prof" readonly style="background: #eee;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Ikastetxea: *</label>
                        <input type="text" id="form-school" required>
                    </div>
                    <div class="form-group">
                        <label>Etapa / maila: *</label>
                        <select id="form-stage" required>
                            <option value="">Hautatu bat...</option>
                            <option value="Derrigorrezko Bigarren Hezkuntza (DBH)">DBH</option>
                            <option value="Oinarrizko Lanbide Heziketa">Oinarrizko LH</option>
                            <option value="Erdi-mailako Lanbide Heziketa">Erdi-mailako LH</option>
                            <option value="Goi-mailako Lanbide Heziketa">Goi-mailako LH</option>
                            <option value="Batxilergoa">Batxilergoa</option>
                            <option value="Gela Egonkorra">Gela Egonkorra</option>
                            <option value="ZIG Gela">ZIG Gela</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Kasuaren kodea / ID: *</label>
                        <input type="text" id="form-id" required>
                    </div>
                    <div class="form-group">
                        <label>Jaioteguna:</label>
                        <input type="date" id="form-birth">
                    </div>
                    <div class="form-group">
                        <label>Txosten medikoa?</label>
                        <select id="form-medical">
                            <option value="Ez">Ez</option>
                            <option value="Bai">Bai</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #eef7fa; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label>Premia nag
